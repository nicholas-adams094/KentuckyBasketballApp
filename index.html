<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0033a0" />
    <meta name="color-scheme" content="light dark" />
    <title>Big Blue Archive · Kentucky Basketball, the Tubby Smith Era 1997–2007</title>
    <meta
      name="description"
      content="An interactive archive of Kentucky men's basketball under Tubby Smith, 1997–2007: ten seasons, 58 player profiles, 346 games, complete rosters, postseason paths, comparisons and decade leaderboards."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!--
      Applies the stored theme before first paint so a dark-mode reader never sees a
      white flash. Kept inline and tiny on purpose; the app takes over after hydration.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bba:theme');
          var choice = stored ? JSON.parse(stored) : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var density = localStorage.getItem('bba:density');
          document.documentElement.dataset.density = density ? JSON.parse(density) : 'comfortable';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 44rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif">
        <h1>Big Blue Archive</h1>
        <p>
          This archive of Kentucky men's basketball under Tubby Smith (1997–2007) is an interactive
          application and requires JavaScript. The underlying historical data is available as JSON in the
          project repository under <code>src/data/archive.json</code>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
